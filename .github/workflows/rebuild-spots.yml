name: Reconstruire la base des spots

on:
  schedule:
    - cron: "40 3 * * 1" # tous les lundis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retélécharger ParaglidingEarth + OpenStreetMap
        run: node scripts/fetch-sources.js
      - name: Reconstruire spots.json
        run: node scripts/build-spots.js
      - name: Rafraîchir la liste des balises OpenWindMap
        run: node scripts/fetch-beacons.js
      - name: Committer si la base a changé
        run: |
          git config user.name "petitoizo-bot"
          git config user.email "actions@github.com"
          git add data/raw public/data/spots.json public/data/beacons.json
          if git diff --cached --quiet; then
            echo "aucun changement"
          else
            git commit -m "spots: mise à jour des sources $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
